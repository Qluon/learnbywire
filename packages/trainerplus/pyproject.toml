[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "learnbywire-trainerplus"
version = "1.1.1"
description = "Experimental CPT/SFT orchestration with HF Trainer and optional OptimizerPlus control"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = ["torch>=2.11,<2.12", "numpy>=1.24", "transformers>=5.8,<5.9", "accelerate>=1.13,<1.14"]
authors = [{name = "Qluon Inc"}]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3"]

[project.optional-dependencies]
lora = ["peft>=0.19,<0.20"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["trainerplus*"]

[tool.setuptools]
include-package-data = false
