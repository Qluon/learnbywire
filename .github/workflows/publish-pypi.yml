name: Publish audited wheels to PyPI

on:
  workflow_dispatch:
    inputs:
      project:
        description: Package to validate or publish
        required: true
        type: choice
        options:
          - learnbywire-trainerplus
          - learnbywire-optimizerplus
          - learnbywire
      publish:
        description: Publish the verified wheel to PyPI
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pypi-${{ inputs.project }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'Qluon/learnbywire' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate the exact qualified release wheel
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PROJECT: ${{ inputs.project }}
        run: python tools/prepare_pypi_upload.py --project "$RELEASE_PROJECT" --output dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-wheel
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7
  publish:
    if: inputs.publish
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/${{ inputs.project }}/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-wheel
          path: dist
      - name: Publish through PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/
